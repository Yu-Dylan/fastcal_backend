<!DOCTYPE html>
<html>
<head>
    <title>Connecting...</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #1a1a1a;
            color: white;
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div id="status" style="text-align: center; margin-top: 20px; color: #ccc;"></div>
    <script>
        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            
            const statusEl = document.getElementById('status');
            
            // Detect environment
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const BACKEND_URL = isLocal ? 'http://localhost:8000' : 'https://fastcal-backend.onrender.com';
            const FRONTEND_URL = isLocal ? 'http://localhost:5173' : 'https://fastcal.onrender.com';
            
            if (!code) {
                document.body.innerHTML = '<div style="color: red; text-align: center; padding: 2rem;">Error: Missing authorization code</div>';
                return;
            }

            console.log('OAuth callback - state:', state, 'code:', code);
            console.log('Environment:', isLocal ? 'local' : 'production');
            console.log('Backend URL:', BACKEND_URL);
            console.log('Frontend URL:', FRONTEND_URL);

        // Check if this is a login flow or calendar connection
        if (state === 'login') {
            // Handle login flow
            statusEl.textContent = 'Getting user info...';
            console.log('Step 1: Calling handleGoogleLogin');
            
            fetch(`${BACKEND_URL}/api/CalendarSync/handleGoogleLogin`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            })
            .then(res => {
                console.log('handleGoogleLogin response status:', res.status);
                return res.json();
            })
            .then(data => {
                console.log('handleGoogleLogin data:', data);
                if (data.email && data.name) {
                    statusEl.textContent = 'Creating session...';
                    console.log('Step 2: Creating session for user:', data.userId);
                    
                    // Create session
                    return fetch(`${BACKEND_URL}/api/Session/create`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user: data.userId,
                            email: data.email,
                            name: data.name
                        })
                    });
                } else {
                    throw new Error(data.error || 'Failed to get user info');
                }
            })
            .then(res => {
                console.log('Session create response status:', res.status);
                return res.json();
            })
            .then(sessionData => {
                console.log('Session data:', sessionData);
                if (sessionData.token) {
                    statusEl.textContent = 'Redirecting...';
                    console.log('Step 3: Session created, redirecting with token');
                    
                    // Redirect to app with token in URL (will be stored by frontend)
                    setTimeout(() => {
                        window.location.href = `${FRONTEND_URL}?token=${sessionData.token}`;
                    }, 500);
                } else {
                    throw new Error(sessionData.error || 'Failed to create session');
                }
            })
            .catch(err => {
                console.error('Login error:', err);
                document.body.innerHTML = '<div style="color: red; text-align: center; padding: 2rem;">Login Error: ' + err.message + '<br><br>Check browser console for details</div>';
            });
        } else if (state) {
            // Handle calendar connection flow (state is user ID)
            fetch(`${BACKEND_URL}/api/CalendarSync/handleGoogleCallback`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: state, code: code })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Redirect back to app
                    window.location.href = FRONTEND_URL;
                } else {
                    document.body.innerHTML = '<div style="color: red; text-align: center; padding: 2rem;">Error: ' + (data.error || 'Unknown error') + '</div>';
                }
            })
            .catch(err => {
                document.body.innerHTML = '<div style="color: red; text-align: center; padding: 2rem;">Error: ' + err.message + '</div>';
            });
        } else {
            document.body.innerHTML = '<div style="color: red; text-align: center; padding: 2rem;">Error: Invalid state parameter</div>';
        }
        }
        
        // Call the function
        handleCallback();
    </script>
</body>
</html>
