<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastCal - Login Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 20px;
        }
        .error {
            color: #e74c3c;
            background: #fee;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Signing you in...</h1>
        <p id="message">Please wait while we complete your login.</p>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');
            const authFlow = localStorage.getItem('auth_flow');

            if (error) {
                document.getElementById('error').textContent = 'Login failed: ' + error;
                document.getElementById('error').style.display = 'block';
                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('h1').textContent = 'Login Failed';
                return;
            }

            if (!code || authFlow !== 'login') {
                document.getElementById('error').textContent = 'Invalid login attempt';
                document.getElementById('error').style.display = 'block';
                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('h1').textContent = 'Login Failed';
                return;
            }

            try {
                // Handle Google login
                const response = await fetch('/api/CalendarSync/handleGoogleLogin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });

                const data = await response.json();

                if (response.ok && data.email && data.name) {
                    // Create session
                    const sessionResponse = await fetch('/api/Session/create', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user: data.userId,
                            email: data.email,
                            name: data.name
                        })
                    });

                    const sessionData = await sessionResponse.json();

                    if (sessionResponse.ok && sessionData.token) {
                        // Store session and redirect
                        localStorage.setItem('session_token', sessionData.token);
                        localStorage.removeItem('auth_flow');
                        window.location.href = '/';
                    } else {
                        throw new Error(sessionData.error || 'Failed to create session');
                    }
                } else {
                    throw new Error(data.error || 'Failed to get user info');
                }
            } catch (err) {
                document.getElementById('error').textContent = err.message || 'Login failed';
                document.getElementById('error').style.display = 'block';
                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('h1').textContent = 'Login Failed';
            }
        }

        // Handle the callback
        handleCallback();
    </script>
</body>
</html>
